kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: pqc-dnssec-bench
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30053
        hostPort: 30053
        protocol: UDP
      - containerPort: 30054
        hostPort: 30054
        protocol: TCP
      - containerPort: 30153
        hostPort: 30153
        protocol: TCP
    # NOTE: Kind doesn't support memory limits in config natively.
    # After cluster creation, apply via:
    #   docker update --memory=8g --memory-swap=8g pqc-dnssec-bench-control-plane
    #   docker update --memory=2g --memory-swap=2g pqc-dnssec-bench-worker
  - role: worker
networking:
  disableDefaultCNI: false
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
